[tox]
envlist = py,qa
skip_missing_interpreters = True
isolated_build = true
minversion = 4.0.0

[testenv]
commands =
	pip install ../fx/plasmafx/
	pip install ../fx/plasmafx_plugin_cycle/
	coverage run -m pytest -v -r wsx
	coverage report
deps =
	mock
	pytest>=3.1
	pytest-cov
	build

[testenv:qa]
commands =
	check-manifest
	python -m build --no-isolation
	python -m twine check dist/*
	isort --check .
	ruff check plasma
	ruff check ../examples
	codespell .
deps =
	-r{toxinidir}/../requirements-dev.txt

